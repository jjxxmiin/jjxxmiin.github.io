name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # A push made by a publisher workflow's GITHUB_TOKEN does not emit another
  # workflow push event. Build once a publisher finishes, but only when it
  # actually advanced main (no-op retry runs are skipped by the job condition).
  workflow_run:
    workflows: ["Daily AI Trend Post", "Daily Keyword Guide Post"]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, but let in-progress production deploys finish
# (GitHub's recommended setting). cancel-in-progress: true caused the deploy step to
# intermittently fail with "superseded" when a second run started.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_sha != github.sha
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate content quality
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python tools/audit_content_quality.py --warnings-as-errors

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      # The "Deploy to GitHub Pages" step is flaky (build always passes). Retry up to 3x;
      # only fail the job if all three attempts fail.
      - name: Deploy to GitHub Pages (attempt 1)
        id: d1
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 15
        continue-on-error: true
      - name: Deploy to GitHub Pages (attempt 2)
        id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 15
        continue-on-error: true
      - name: Deploy to GitHub Pages (attempt 3)
        id: deployment
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 15

  # 배포가 끝난 다음에 색인 요청을 보낸다. 순서가 중요하다. 아직 안 올라간 URL 을
  # 제출하면 검색엔진이 확인하러 왔다가 404 를 보고 그냥 버린다.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 발행 봇의 push 는 workflow_run 으로 들어오고, 그때 github.sha 는 봇 커밋보다
          # 뒤처져 있다. 항상 main 최신을 받아야 방금 올라온 글이 diff 에 잡힌다.
          ref: main
          fetch-depth: 20

      - name: Ping IndexNow (Naver, Bing)
        env:
          # 발행 워크플로가 시작한 커밋. 그 이후 추가된 글만 골라 제출한다.
          INDEXNOW_BASE: ${{ github.event.workflow_run.head_sha || github.event.before }}
        run: python3 automation/ping_indexnow.py
