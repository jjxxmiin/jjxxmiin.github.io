name: Daily OSS Trend Post

on:
  schedule:
    # 저녁 1회. GitHub의 예약 실행은 상시 1~2시간 지연되므로 19시 KST로 잡아
    # 실제 발행이 20:30~21:30 KST에 떨어지게 한다. 아침 AI 뉴스 잡과는 별개로 돈다.
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '오늘 글이 있어도 테스트용 새 글을 발행'
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-oss-trend-post
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check today's post
        id: today
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            today="$(TZ=Asia/Seoul date +%Y-%m-%d)"
            if grep -l -E '^automation: oss_trend$' "_posts/${today}-"*.md >/dev/null 2>&1; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "오늘의 오픈소스 트렌드 글이 이미 있어 API 호출 없이 종료합니다."
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Python
        if: steps.today.outputs.exists != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        if: steps.today.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: automation/package-lock.json

      - name: Install dependencies
        if: steps.today.outputs.exists != 'true'
        run: |
          cd automation
          pip install -r requirements.txt
          npm ci --no-audit --no-fund

      - name: Run OSS Trend Bot
        if: steps.today.outputs.exists != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # fetch_project_meta의 GitHub API 호출이 익명 60req/h 한도에 걸리지 않도록.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OSS_TREND_FORCE_PUBLISH: ${{ inputs.force || 'false' }}
        run: |
          cd automation
          for attempt in 1 2 3; do
            echo "발행 시도 ${attempt}/3"
            if python oss_trend_bot.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 30
            fi
          done
          exit 1

      - name: Commit and Push
        if: steps.today.outputs.exists != 'true'
        run: |
          git config --global user.name 'OPSOAI Bot'
          git config --global user.email 'ceo@opsoai.com'
          git add _posts/
          git commit -m "Auto-generated OSS trend post for $(date +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git pull --rebase
          git push
