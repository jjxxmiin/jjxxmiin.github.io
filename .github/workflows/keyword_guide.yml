name: Daily Keyword Guide Post

# 과거 검색 수요 기반 가이드 생성기. Gemini 비용 방지를 위해 예약 실행은
# 중단했으며, 보존된 수동 실행도 명시적인 검증 작업에만 사용한다.

on:
  # Gemini 비용이 발생하는 예약 발행은 중단했다. 명시적으로 필요할 때만 실행한다.
  workflow_dispatch:
    inputs:
      force:
        description: '시각 조건과 중복 검사를 무시하고 지금 발행'
        required: false
        type: boolean
        default: false
      topic_id:
        description: '특정 주제 id를 지정 (비우면 큐 우선순위대로)'
        required: false
        type: string

concurrency:
  group: daily-keyword-guide
  cancel-in-progress: false

jobs:
  build:
    # Gemini 자동 생성은 사용하지 않는다. 워크플로 기록만 보존한다.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # concurrency 큐에서 기다린 실행도 직전 봇 커밋을 포함한 최신 main으로 검사한다.
          ref: main

      - name: Decide whether to run now
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "수동 강제 실행."
            exit 0
          fi

          today="$(TZ=Asia/Seoul date +%Y-%m-%d)"
          # 오늘 이미 이 봇이 쓴 글이 있으면 끝.
          if grep -l '^automation: keyword_guide$' "_posts/${today}-"*.md >/dev/null 2>&1; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "오늘 가이드 글이 이미 있어 종료합니다."
            exit 0
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "오늘 글이 없어 실행합니다. 지연된 예약 실행도 버리지 않습니다."

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: automation/package-lock.json

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          cd automation
          pip install -r requirements.txt
          npm ci --no-audit --no-fund

      - name: Run automation resilience tests
        if: steps.gate.outputs.run == 'true'
        run: PYTHONPATH=.:automation python -m unittest automation.test_automation_resilience -v

      - name: Prepare thumbnail rendering
        if: steps.gate.outputs.run == 'true'
        # GitHub 러너에는 google-chrome 이 이미 깔려 있다. chromium-browser 를
        # apt 로 받으면 ubuntu-24.04 에서는 snap 전환 패키지라 실패한다.
        # 한 줄로 묶으면 그 실패가 imagemagick 설치까지 같이 날려서,
        # JPEG 변환이 안 되는 채로 발행될 수 있다. 그래서 따로 세운다.
        run: |
          which google-chrome || echo "google-chrome 없음. 카드 없이 발행됩니다."
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq imagemagick || echo "ImageMagick 없음. PNG로 저장됩니다."

      - name: Refresh topic queue
        if: steps.gate.outputs.run == 'true'
        # 원장(written_topics.json)을 반영해 이미 쓴 주제를 큐에서 뺀다.
        run: python automation/build_topic_queue.py --write

      - name: Run Keyword Guide Bot
        if: steps.gate.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          cd automation
          ARGS=""
          if [ -n "${{ inputs.topic_id }}" ]; then
            ARGS="--topic-id ${{ inputs.topic_id }}"
          fi
          python guide_bot.py $ARGS

      - name: Enrich and validate the new post
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          mapfile -t changed_posts < <(git status --porcelain -- _posts | cut -c4-)
          if [ "${#changed_posts[@]}" -eq 0 ]; then
            echo "생성된 글이 없습니다."
            exit 1
          fi
          for post in "${changed_posts[@]}"; do
            python tools/enrich_post_graph.py --write --only "$post"
          done
          python tools/audit_content_quality.py --warnings-as-errors

      - name: Commit and Push
        if: steps.gate.outputs.run == 'true'
        run: |
          git config --global user.name 'OPSOAI Bot'
          git config --global user.email 'ceo@opsoai.com'
          git add _posts/ assets/img/thumb/ automation/data/
          git commit -m "Auto-generated keyword guide post for $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')" \
            || echo "No changes to commit"
          git pull --rebase
          git push
