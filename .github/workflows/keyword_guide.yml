name: Daily Keyword Guide Post

# 검색 수요가 확인된 주제로 실용 가이드를 하루 한 편 발행한다.
# 오픈소스 트렌드 봇(oss_trend.yml)을 대체한다. 612편을 쓰고도 하루 검색 세션이
# 4.4였던 이유가 '아무도 안 찾는 주제'였기 때문이라, 자동완성으로 수요를 확인한
# 주제만 골라 쓰는 쪽으로 바꿨다.
#
# 발행 시각은 매일 다르다. 오후 14~19시(KST) 사이에서 날짜로부터 결정되는
# 시각에 한 번 나간다. 같은 시각에 기계처럼 올라오는 것보다 자연스럽고,
# 여러 시간대의 독자에게 걸린다.

on:
  schedule:
    # 05:00~10:00 UTC = 14:00~19:00 KST. 매시 정각에 깨어나 자기 차례인지 확인한다.
    # GitHub의 예약 실행은 상시 1~2시간 지연되므로, 목표 시각을 '지났는지'로 판단해
    # 지연이 나도 그날 안에는 반드시 한 번 발행되게 한다.
    - cron: '0 5,6,7,8,9,10 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '시각 조건과 중복 검사를 무시하고 지금 발행'
        required: false
        type: boolean
        default: false
      topic_id:
        description: '특정 주제 id를 지정 (비우면 큐 우선순위대로)'
        required: false
        type: string

concurrency:
  group: daily-keyword-guide
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decide whether to run now
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "수동 강제 실행."
            exit 0
          fi

          today="$(TZ=Asia/Seoul date +%Y-%m-%d)"
          hour="$(TZ=Asia/Seoul date +%-H)"

          # 오늘 이미 이 봇이 쓴 글이 있으면 끝.
          if grep -l '^automation: keyword_guide$' "_posts/${today}-"*.md >/dev/null 2>&1; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "오늘 가이드 글이 이미 있어 종료합니다."
            exit 0
          fi

          # 날짜 해시로 14~19시 중 목표 시각을 정한다. 매일 달라지지만
          # 같은 날 여러 번 깨어나도 값은 일정하다.
          target=$(( 14 + $(printf '%s' "$today" | cksum | cut -d' ' -f1) % 6 ))
          echo "오늘 목표 시각: ${target}시 (현재 ${hour}시, KST)"

          if [ "$hour" -ge "$target" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "아직 목표 시각 전입니다."
          fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: automation/package-lock.json

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          cd automation
          pip install -r requirements.txt
          npm ci --no-audit --no-fund

      - name: Prepare thumbnail rendering
        if: steps.gate.outputs.run == 'true'
        # GitHub 러너에는 google-chrome 이 이미 깔려 있다. chromium-browser 를
        # apt 로 받으면 ubuntu-24.04 에서는 snap 전환 패키지라 실패한다.
        # 한 줄로 묶으면 그 실패가 imagemagick 설치까지 같이 날려서,
        # JPEG 변환이 안 되는 채로 발행될 수 있다. 그래서 따로 세운다.
        run: |
          which google-chrome || echo "google-chrome 없음. 카드 없이 발행됩니다."
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq imagemagick || echo "ImageMagick 없음. PNG로 저장됩니다."

      - name: Refresh topic queue
        if: steps.gate.outputs.run == 'true'
        # 원장(written_topics.json)을 반영해 이미 쓴 주제를 큐에서 뺀다.
        run: python automation/build_topic_queue.py --write

      - name: Run Keyword Guide Bot
        if: steps.gate.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd automation
          ARGS=""
          if [ -n "${{ inputs.topic_id }}" ]; then
            ARGS="--topic-id ${{ inputs.topic_id }}"
          fi
          for attempt in 1 2 3; do
            echo "발행 시도 ${attempt}/3"
            if python guide_bot.py $ARGS; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 30
            fi
          done
          exit 1

      - name: Commit and Push
        if: steps.gate.outputs.run == 'true'
        run: |
          git config --global user.name 'OPSOAI Bot'
          git config --global user.email 'ceo@opsoai.com'
          git add _posts/ assets/img/thumb/ automation/data/
          git commit -m "Auto-generated keyword guide post for $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')" \
            || echo "No changes to commit"
          git pull --rebase
          git push
