name: Twice Daily Bilingual AI News

on:
  schedule:
    # 하루 2회, 회차당 같은 기사의 영어판과 한국어판을 함께 발행한다.
    # 두 번째 실행은 첫 글의 URL/제목/엔티티 이력을 읽어 같은 사건을 제외한다.
    - cron: '0 0 * * *' # 00:00 UTC = 09:00 KST
    - cron: '0 8 * * *' # 08:00 UTC = 17:00 KST
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: twice-daily-ai-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd automation
          pip install -r requirements.txt

      - name: Set up Node (Mermaid validation)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mermaid validator deps
        run: |
          cd automation
          npm install --no-audit --no-fund

      - name: Test AI news pipeline
        run: |
          cd automation
          python -m unittest -v test_daily_ai_news_bot.py

      - name: Run AI News Editorial Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_NEWS_WINDOW_HOURS: '72'
          AI_NEWS_MAX_SOURCE_AGE_DAYS: '7'
        run: |
          cd automation
          python daily_ai_news_bot.py

      - name: Commit and Push
        run: |
          git config --global user.name 'OPSOAI Bot'
          git config --global user.email 'ceo@opsoai.com'
          git add _posts/ assets/img/news/
          git commit -m "Publish bilingual verified AI news [$(date +'%Y-%m-%d %H:%M UTC')]" || echo "No changes to commit"
          git pull --rebase
          git push
