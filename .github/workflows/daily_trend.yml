name: Daily AI Trend Post

on:
  schedule:
    # 하루 2회 자동 포스팅 (오전/오후). 최근 AI 뉴스 중 팩트체크와 중복 검사를
    # 통과한 사건을 매 실행마다 한 건씩 발행한다.
    - cron: '0 0 * * *' # 00:00 UTC = 09:00 KST (오전)
    - cron: '0 8 * * *' # 08:00 UTC = 17:00 KST (오후)
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          cd automation
          pip install -r requirements.txt

      - name: Run Daily AI News Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd automation
          python daily_trend_bot.py

      - name: Commit and Push
        run: |
          git config --global user.name 'OPSOAI Bot'
          git config --global user.email 'ceo@opsoai.com'
          git add _posts/
          git commit -m "Auto-generated AI news post for $(date +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git pull --rebase
          git push
