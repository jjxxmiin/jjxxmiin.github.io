name: Daily AI Trend Post

on:
  schedule:
    # 오전 9시에 발행하고, 실패한 날만 오후 3시와 9시에 재시도한다.
    # 이미 당일 글이 있으면 checkout 직후 종료해 Gemini를 호출하지 않는다.
    - cron: '0 0,6,12 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '오늘 글이 있어도 테스트용 새 글을 발행'
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-ai-news-post
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check today's post
        id: today
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            today="$(TZ=Asia/Seoul date +%Y-%m-%d)"
            if grep -l -E '^automation: daily_ai_news$|^news_headline:' "_posts/${today}-"*.md >/dev/null 2>&1; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "오늘의 자동 글이 이미 있어 API 호출 없이 종료합니다."
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Python
        if: steps.today.outputs.exists != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        if: steps.today.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: automation/package-lock.json

      - name: Install dependencies
        if: steps.today.outputs.exists != 'true'
        run: |
          cd automation
          pip install -r requirements.txt
          npm ci --no-audit --no-fund

      - name: Run Daily AI News Bot
        if: steps.today.outputs.exists != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_NEWS_FORCE_PUBLISH: ${{ inputs.force || 'false' }}
        run: |
          cd automation
          for attempt in 1 2 3; do
            echo "발행 시도 ${attempt}/3"
            if python daily_trend_bot.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 30
            fi
          done
          exit 1

      - name: Commit and Push
        if: steps.today.outputs.exists != 'true'
        run: |
          git config --global user.name 'OPSOAI Bot'
          git config --global user.email 'ceo@opsoai.com'
          git add _posts/
          git commit -m "Auto-generated AI news post for $(date +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git pull --rebase
          git push
