name: Daily AI Trend Post

on:
  # Gemini 비용이 발생하는 예약 발행은 중단했다. 명시적으로 필요할 때만 실행한다.
  workflow_dispatch:
    inputs:
      force:
        description: '오늘 글이 있어도 테스트용 새 글을 발행'
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-ai-news-post
  cancel-in-progress: false

jobs:
  build:
    # Gemini 자동 생성은 사용하지 않는다. 워크플로 기록만 보존한다.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 오래 대기한 예약 실행도 시작 시점의 최신 발행 상태를 봐야 한다.
          # 이벤트가 만들어질 때의 오래된 SHA를 받으면 같은 날짜 글을 중복 생성한다.
          ref: main

      - name: Check today's post
        id: today
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "수동 강제 실행."
            exit 0
          fi

          today="$(TZ=Asia/Seoul date +%Y-%m-%d)"
          if grep -l -E '^automation: daily_ai_news$|^news_headline:' "_posts/${today}-"*.md >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "오늘의 자동 글이 이미 있어 API 호출 없이 종료합니다."
            exit 0
          fi

          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "오늘 글이 없어 실행합니다. 지연된 예약 실행도 버리지 않습니다."

      - name: Set up Python
        if: steps.today.outputs.exists != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        if: steps.today.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: automation/package-lock.json

      - name: Install dependencies
        if: steps.today.outputs.exists != 'true'
        run: |
          cd automation
          pip install -r requirements.txt
          npm ci --no-audit --no-fund

      - name: Run automation resilience tests
        if: steps.today.outputs.exists != 'true'
        run: PYTHONPATH=.:automation python -m unittest automation.test_automation_resilience -v

      - name: Prepare thumbnail rendering
        if: steps.today.outputs.exists != 'true'
        # GitHub 러너에는 google-chrome 이 이미 깔려 있다. chromium-browser 를
        # apt 로 받으면 ubuntu-24.04 에서는 snap 전환 패키지라 실패한다.
        # 한 줄로 묶으면 그 실패가 imagemagick 설치까지 같이 날려서,
        # JPEG 변환이 안 되는 채로 발행될 수 있다. 그래서 따로 세운다.
        run: |
          which google-chrome || echo "google-chrome 없음. 카드 없이 발행됩니다."
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq imagemagick || echo "ImageMagick 없음. PNG로 저장됩니다."


      - name: Run Daily AI News Bot
        if: steps.today.outputs.exists != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_NEWS_FORCE_PUBLISH: ${{ inputs.force || 'false' }}
          AI_NEWS_MAX_CANDIDATES: '3'
          PYTHONUNBUFFERED: '1'
        run: |
          cd automation
          python daily_trend_bot.py

      - name: Enrich and validate the new post
        if: steps.today.outputs.exists != 'true'
        shell: bash
        run: |
          mapfile -t changed_posts < <(git status --porcelain -- _posts | cut -c4-)
          if [ "${#changed_posts[@]}" -eq 0 ]; then
            echo "생성된 글이 없습니다."
            exit 1
          fi
          for post in "${changed_posts[@]}"; do
            python tools/enrich_post_graph.py --write --only "$post"
          done
          python tools/audit_content_quality.py --warnings-as-errors

      - name: Commit and Push
        if: steps.today.outputs.exists != 'true'
        run: |
          git config --global user.name 'OPSOAI Bot'
          git config --global user.email 'ceo@opsoai.com'
          git add _posts/ assets/img/thumb/
          git commit -m "Auto-generated AI news post for $(date +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git pull --rebase
          git push
