title: "[자유 토론] "
body:
  - type: markdown
    attributes:
      value: |
        AI와 기술에 관한 생각이나 경험을 자유롭게 나눠 주세요.
        질문의 정답을 찾는 글이라면 **Q&A** 카테고리가 더 잘 맞습니다.
  - type: dropdown
    id: topic_type
    attributes:
      label: 이야기 종류
      options:
        - 자유 토론
        - 논문·글 같이 읽기
        - 정보 공유
        - 커뮤니티 의견 묻기
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: 이야기
      description: 배경과 함께 나누고 싶은 생각을 적어 주세요.
      placeholder: 어떤 계기로 이 주제에 관심을 갖게 되었나요?
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 관련 글, 논문, 저장소가 있다면 링크를 남겨 주세요.
      placeholder: 링크와 간단한 설명을 함께 적어 주세요.
    validations:
      required: false
  - type: checkboxes
    id: guidelines
    attributes:
      label: 커뮤니티 약속
      options:
        - label: 서로를 존중하고 개인정보·스팸·무관한 광고를 올리지 않겠습니다.
          required: true
