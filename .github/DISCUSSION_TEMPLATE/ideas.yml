title: "[콘텐츠 제안] "
body:
  - type: markdown
    attributes:
      value: |
        OPSOAI에서 다뤘으면 하는 논문, 오픈소스, AI 도구와 주제를 알려 주세요.
        구체적인 이유를 함께 적어 주시면 콘텐츠 선정에 큰 도움이 됩니다.
  - type: input
    id: topic
    attributes:
      label: 제안할 주제
      placeholder: 논문·프로젝트·도구 이름
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 왜 이 주제가 궁금한가요?
      placeholder: 궁금한 부분과 독자에게 도움이 될 이유를 적어 주세요.
    validations:
      required: true
  - type: dropdown
    id: desired_format
    attributes:
      label: 원하는 글의 방향
      options:
        - 핵심만 빠르게 이해하는 요약
        - 내부 구조와 원리를 파고드는 기술 분석
        - 직접 사용해 보는 리뷰·튜토리얼
        - 비슷한 도구와 비교
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 링크
      placeholder: 공식 사이트, 논문, GitHub 저장소 URL
    validations:
      required: false
  - type: checkboxes
    id: guidelines
    attributes:
      label: 커뮤니티 약속
      options:
        - label: 이해관계가 있는 제품·프로젝트라면 본문에 투명하게 밝히겠습니다.
          required: true
